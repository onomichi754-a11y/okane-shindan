<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5問でわかる、あなたのタイプ</title>
<meta property="og:title" content="5問でわかる、あなたのタイプ">
<meta property="og:description" content="5問に答えるだけ。結果は傾向であり、断定ではありません。">
<meta property="og:type" content="website">
<script>
/* =====================================================================
   ここから下の4つの欄だけを書き換えてください。
   欄の外（この枠より下のプログラム）は触らなくて大丈夫です。
   書き方の決まり：文の前後の「"」は消さない。行の終わりの「,」も消さない。
   ===================================================================== */

/* ---------- ここを書き換える：①名前と肩書き ---------- */
var OWNER = {
  name:  "おのみちゆきこ",          // あなたの名前
  title: "家計の話し相手",          // 肩書き1行（会社名・商品名は入れない）
  pageTitle: "そのお金、何のため？タイプ診断"  // ページの見出し
};

/* ---------- ここを書き換える：②質問5つと選択肢 ----------
   1問につき選択肢は2つ。type には③で決めるタイプの記号（A/B/C/D）を書く。
   その選択肢を選んだ人は、そのタイプに1点入ります。
   ※このページでは判定を「2つの軸の多数決」に変えたため、type は判定に使っていません。
     上の選択肢＝「分ける」「金額で決める」側、下の選択肢＝「まとめる」「感覚で判断」側として判定します。
     選択肢の上下を入れ替えると結果が変わるので、順番はこのままにしてください。 */
var QUESTIONS = [
  { q: "貯金の口座や袋は？",
    a: [ { text: "目的ごとに分ける", type: "C" },
         { text: "一つにまとめる", type: "D" } ] },
  { q: "家計の記録のつけ方は？",
    a: [ { text: "項目ごとに分ける", type: "C" },
         { text: "合計だけ見る", type: "D" } ] },
  { q: "貯金のしかたは？",
    a: [ { text: "目的ごとに額を決める", type: "A" },
         { text: "ざっくり一つで", type: "B" } ] },
  { q: "どこまで貯めるかは？",
    a: [ { text: "金額で決めている", type: "D" },
         { text: "安心できるまで", type: "B" } ] },
  { q: "大きな出費の前は？",
    a: [ { text: "時期と額を書き出す", type: "A" },
         { text: "その時に考える", type: "C" } ] }
];

/* ---------- ここを書き換える：③タイプ名・一言・結果文 ----------
   タイプは3〜4つ。記号（A/B/C/D）は②と合わせる。
   結果文は120字前後。商品名・利回り・将来の数字は入れない。
   タイプ名で人を下に見る言葉（浪費型など）は使わない。
   key は、結果のボタンを押したときLINEのトークに入る言葉。
   LINE公式アカウントの応答メッセージのキーワードと同じにする。     */
var TYPES = {
  A: { name: "🐿️ リス型",
       key:  "リス",
       one:  "目的ごとに分ける × 金額で決める",
       text: "リスが冬に備えて木の実を分けてしまうように、目的ごとにお金を分け、金額の目安まで決めているタイプ。得意なのは、何にいくら必要かを数字で見通せること。つまずきやすい所は、名前をつけた袋が増えるほど、全体の様子が見えにくくなること。年に一度、全体を並べて眺めると整理しやすくなります。LINE登録で、名前つきの貯金を1枚で見渡せる全体シートを送ります。" },
  B: { name: "🐬 イルカ型",
       key:  "イルカ",
       one:  "一つにまとめる × 感覚で判断する",
       text: "イルカが波の流れを読んで泳ぐように、お金を一つにまとめ、その時々の状況で判断するタイプ。得意なのは、細かく決めすぎず、変化に柔軟に対応できること。つまずきやすい所は、目的も目安も決めていない分、「どこまで備えればいいか」が見えにくいこと。まず一つだけ、お金に名前をつけてみるのがおすすめです。LINE登録で、最初の1つに名前をつける、かんたんワークを送ります。" },
  C: { name: "🐦 ツバメ型",
       key:  "ツバメ",
       one:  "目的ごとに分ける × 感覚で判断する",
       text: "ツバメが季節ごとに行き先を変えるように、目的ごとにお金を分け、そのときの状況に合わせて動けるタイプ。得意なのは、使い道をはっきりさせて、気持ちよくお金を使えること。つまずきやすい所は、「どこまで貯めるか」の目安があいまいになりやすいこと。名前の横に金額を一つ書き添えると、見通しが立ちやすくなります。LINE登録で、お金の名前に目安の金額を書き添えるシートを送ります。" },
  D: { name: "🐘 ゾウ型",
       key:  "ゾウ",
       one:  "一つにまとめる × 金額で決める",
       text: "ゾウが大きな体にたっぷり蓄えるように、お金を一つにまとめ、金額の目安で管理するタイプ。得意なのは、シンプルな形で、全体の数字をしっかりつかめること。つまずきやすい所は、ひとかたまりのお金の中で、何のためのお金かを区別しにくいこと。大きな目的を2〜3個だけ名前にしてみると、使いどきが判断しやすくなります。LINE登録で、大きなお金を2〜3個に名前分けするシートを送ります。" }
};

/* ---------- ここを書き換える：④LINEへの一言とURL ----------
   url には LINE公式アカウントの友だち追加URL（lin.ee で始まる形）をそのまま貼る。
   短縮URLは使わない。LINEが使えない人は mailto:あなたのメール でも可。   */
var LINE = {
  button: "このタイプの方向けの1枚を、LINEで受け取る",
  oaId:   "@376svqbu",               // LINE公式アカウントのID（@から書く）
  url:    "https://lin.ee/R4DYqnw",  // 友だち追加URL（うまく開かないとき用）
  note:   "LINEが開いたら、そのまま送信してください。あなたのタイプ向けの1枚が届きます。こちらから売り込みの連絡はしません。"
};

/* ===================== ここから下は触らない ===================== */
</script>
<style>
:root{--paper:#F5FBF8;--white:#fff;--soft:#E3F3EE;--line:#C4E0D8;--navy:#0F4A40;--ink:#17332D;--sub:#44605A;--green:#008E78;--gold:#F07A1C;--gold-l:#FFE27A}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-weight:500;font-size:18px;line-height:1.8;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:22px}
.who{display:inline-block;font-size:16px;font-weight:700;color:var(--sub);background:var(--soft);border-radius:999px;padding:6px 16px}
h1{font-size:28px;line-height:1.4;color:var(--navy);margin:14px 0 8px;font-weight:900}
.lead{font-size:18px;color:var(--sub);margin:0}
.card{background:var(--white);border:2px solid var(--line);border-radius:18px;padding:24px 20px;margin:16px 0}
.prog{display:flex;gap:6px;margin-bottom:14px}
.prog span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog span.on{background:var(--green)}
.qn{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.1em;margin:0 0 6px}
.q{font-size:22px;font-weight:700;color:var(--navy);line-height:1.5;margin:0 0 18px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:19px;font-weight:700;color:var(--navy);background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0;cursor:pointer;line-height:1.5}
.opt:hover,.opt:focus-visible{border-color:var(--green);background:#fff;outline:none}
.back{font:inherit;font-size:16px;font-weight:700;color:var(--sub);background:none;border:0;padding:8px 0;cursor:pointer;text-decoration:underline}
.type-k{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.1em;margin:0}
.type-n{font-size:28px;font-weight:900;color:var(--navy);line-height:1.35;margin:6px 0 4px}
.type-o{font-size:18px;font-weight:700;color:var(--sub);margin:0 0 16px}
.type-t{font-size:19px;margin:0 0 20px}
.btn{display:block;text-align:center;font-size:19px;font-weight:900;color:#fff;background:#06C755;border-radius:14px;padding:18px 16px;text-decoration:none;line-height:1.4}
.btn:hover{filter:brightness(1.05)}
.note{font-size:16px;color:var(--sub);text-align:center;margin:12px 0 0}
.note a{color:var(--green);font-weight:700}
.dis{font-size:16px;color:var(--sub);margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.start{font:inherit;display:block;width:100%;font-size:21px;font-weight:900;color:#fff;background:var(--green);border:0;border-radius:14px;padding:18px;cursor:pointer}
footer{text-align:center;font-size:15px;color:var(--sub);margin-top:30px}
.retry{margin-top:16px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="who" id="who"></span>
    <h1 id="ttl"></h1>
    <p class="lead">5問に答えるだけ。1分で終わります。</p>
  </header>

  <section class="card" id="intro">
    <p style="margin:0 0 18px">名前や連絡先の入力はありません。答えはどこにも保存されません。</p>
    <button class="start" id="startBtn">はじめる</button>
  </section>

  <section class="card" id="quiz" hidden>
    <div class="prog" id="prog"></div>
    <p class="qn" id="qn"></p>
    <p class="q" id="q"></p>
    <div id="opts"></div>
    <button class="back" id="backBtn" hidden>ひとつ前に戻る</button>
  </section>

  <section class="card" id="result" hidden>
    <p class="type-k">あなたのタイプ</p>
    <p class="type-n" id="rName"></p>
    <p class="type-o" id="rOne"></p>
    <p class="type-t" id="rText"></p>
    <a class="btn" id="rBtn" href="#" target="_blank" rel="noopener"></a>
    <p class="note" id="rNote"></p>
    <p class="note">うまく開かないときは、<a id="rAddLink" href="#" target="_blank" rel="noopener">こちらから友だち追加</a>して、タイプ名を送ってください。</p>
    <p class="dis">この結果は、答えから見た傾向です。診断や断定ではありません。特定の商品をおすすめするものでもありません。</p>
    <div class="retry"><button class="back" id="retryBtn">もう一度やってみる</button></div>
  </section>

  <footer>このページは <span id="fName"></span> が作成しました。</footer>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  document.title=OWNER.pageTitle;
  $('who').textContent=OWNER.name+'｜'+OWNER.title;
  $('ttl').textContent=OWNER.pageTitle;
  $('fName').textContent=OWNER.name;
  var i=0,ans=[];
  function show(n){ ['intro','quiz','result'].forEach(function(k){$(k).hidden=(k!==n)}); window.scrollTo(0,0); }
  function render(){
    var Q=QUESTIONS[i];
    $('prog').innerHTML=QUESTIONS.map(function(_,k){return '<span class="'+(k<=i?'on':'')+'"></span>'}).join('');
    $('qn').textContent='質問 '+(i+1)+' / '+QUESTIONS.length;
    $('q').textContent=Q.q;
    var o=$('opts'); o.innerHTML='';
    Q.a.forEach(function(a,j){
      var b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=a.text;
      b.onclick=function(){ ans[i]=j; if(i<QUESTIONS.length-1){i++;render();} else {finish();} };
      o.appendChild(b);
    });
    $('backBtn').hidden=(i===0);
  }
  function finish(){
    /* 判定：2つの軸の多数決（ans には選んだ選択肢の番号 0=上 / 1=下 が入る）
       分け方の軸     = Q1・Q2・Q3 で上を2つ以上 → 分ける、それ以外 → まとめる
       目安の決め方の軸 = Q3・Q4・Q5 で上を2つ以上 → 金額で決める、それ以外 → 感覚で判断 */
    function ups(list){ return list.filter(function(n){return ans[n]===0}).length; }
    var wakeru = ups([0,1,2])>=2, kingaku = ups([2,3,4])>=2;
    var best = wakeru ? (kingaku ? 'A' : 'C')   // A=リス / C=ツバメ
                    : (kingaku ? 'D' : 'B');  // D=ゾウ / B=イルカ
    var T=TYPES[best];
    $('rName').textContent=T.name; $('rOne').textContent=T.one; $('rText').textContent=T.text;
    $('rBtn').textContent=LINE.button;
    $('rBtn').href=(LINE.oaId&&T.key) ? 'https://line.me/R/oaMessage/'+encodeURIComponent(LINE.oaId)+'/?'+encodeURIComponent(T.key) : LINE.url;
    $('rNote').textContent=LINE.note; $('rAddLink').href=LINE.url;
    show('result');
  }
  $('startBtn').onclick=function(){i=0;ans=[];render();show('quiz')};
  $('backBtn').onclick=function(){ if(i>0){i--;render();} };
  $('retryBtn').onclick=function(){show('intro')};
})();
</script>
</body>
</html>
